[project]
name = "oak-genericagent"
version = "0.1.0"
description = "OAK-GenericAgent: 融合 OpenAkita 企业级多 Agent 协作与 GenericAgent 极简自我进化特性"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }
authors = [
    {name = "OpenAkita-GenericAgent Team"}
]

dependencies = [
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "bottle>=0.12",
    "simple-websocket-server>=0.4",
    "pydantic>=2.0",
    "typing-extensions>=4.8",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.28",
    "pywebview>=4.0",
]
all-frontends = [
    "python-telegram-bot>=20.0",
    "qq-botpy>=1.0",
    "pycryptodome>=3.19",
    "qrcode>=7.4",
    "lark-oapi>=1.0",
    "wecom-aibot-sdk>=1.0",
    "dingtalk-stream>=0.20",
]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.7",
]
langgraph = [
    "langgraph>=0.0.20",
    "langchain-core>=0.1.0",
]
observability = [
    "langfuse>=0.10.0",
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation>=0.41",
]

[project.scripts]
oak-ga = "oak_gkernel.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["oak_gkernel"]

[tool.setuptools.packages.find]
where = ["."]
include = ["oak_gkernel*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_ignore = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
